services:

  postgres:
    image: postgres:16
    container_name: sus-connect-postgres

    restart: always

    environment:
      POSTGRES_DB: sus_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: