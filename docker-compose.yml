services:

  # ============================================================
  # PostgreSQL
  # Banco de dados principal do SUS Connect
  # ============================================================
  postgres:
    image: postgres:16
    container_name: sus-connect-postgres

    restart: always

    environment:
      POSTGRES_DB: sus_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sus_connect"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # Apache Kafka
  # Broker da arquitetura Event Driven
  # ============================================================
  kafka:
    image: apache/kafka:3.9.1
    container_name: sus-connect-kafka

    restart: always

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listener externo:
      # localhost:9092
      #
      # Listener interno:
      # kafka:29092
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1


  # ============================================================
  # Machine Learning
  # FastAPI + modelo de predição de No-Show
  # ============================================================
  ml-service:
    image: sus-connect-ml:1.0
    container_name: sus-connect-ml

    restart: always

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ============================================================
  # SUS Connect API
  # Spring Boot / Java 21
  # ============================================================
  api:
    image: sus-connect-api:1.0
    container_name: sus-connect-api

    restart: always

    ports:
      - "8080:8080"

    environment:

      # PostgreSQL
      DB_URL: jdbc:postgresql://postgres:5432/sus_connect
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      # Kafka - listener interno da rede Docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # Machine Learning
      ML_BASE_URL: http://ml-service:8000

    depends_on:

      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

      ml-service:
        condition: service_healthy


# ==============================================================
# Volumes persistentes
# ==============================================================
volumes:

  postgres_data: